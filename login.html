<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inia Sesion en el panel de la empresa." >
    <title>Inicio Sesion | Gerisoft</title>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="assets/images/logo Hogar geriatrico.png" alt="Logo de geriatrico" width="200">
        </a>
    </header>

    <main>
        <div>
           <nav>
     <a href="index.html">&larr; Volver al inicio</a>
        </nav>
            
            <h2>Hogar geriátrico
            <br>
            Amor, Vida y Servicio</h2>
            <p>Inicia sesión para acceder al sistema administrativo del hogar geriátrico.</p>
        </div>
        
         <header>
        <a href="index.html">
            <img src="assets/images/images login.jpg" alt="images login" width="200">
            
        </a>
    </header>

    

        <section aria-labelledby="titulo-login">
            <h1 id="titulo-login">Iniciar Sesión</h1>
               
            <div>
                <p>Accede al panel de administración</p>
            </div>

            <!--form: define el formulario. action indica a dónde se envia los datos-->
            <form action="#" method="POST">
                <!--fieldset agrupa campos; legend describe el grupo -->
                <fieldset>
                    <legend>Credenciales de acceso</legend>
                    <br>
                    <div>
                        <label for="user">Usuario</label>
                        <input type="text" id="user">
                    </div>
                    <br>
                    <div>
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password"
                        required>
                    </div>
                    <br>
                    <div>
                        <input type="checkbox" id="recordar" name="recordar">
                        <label for="recordar">Recordarme en este dispositivo</label>
                    </div>
                </fieldset>
                <br>
                <button type="submit">Ingresar</button>
            </form>
            <br>
            <p><a href="#">¿Olvidaste tu contraseña?</a></p>


        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hogar geriatrico Campo Alegre - Gerisoft</p>
    </footer>

    
</body>
</html>
